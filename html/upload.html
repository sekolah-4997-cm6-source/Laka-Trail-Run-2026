<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muat Naik Resit - Laka Selatan Nanas Run 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library Auto-Compressor -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-lg mx-auto p-6 bg-white shadow-lg mt-10 rounded-lg">
        <h2 class="text-2xl font-bold text-center text-blue-700 mb-2">Muat Naik Bukti Pembayaran</h2>
        <p class="text-center text-gray-600 mb-6">ID Tempahan: <span id="displayId" class="font-bold text-black">Memuatkan...</span></p>

        <form id="uploadForm" class="space-y-4">
            <div>
                <label class="block font-semibold">No. Rujukan Transaksi (Ref No)</label>
                <input type="text" id="refNo" required placeholder="Cth: 1234567890" class="w-full border p-2 rounded mt-1">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold">Tarikh Transaksi</label>
                    <input type="date" id="tarikh" required class="w-full border p-2 rounded mt-1">
                </div>
                <div>
                    <label class="block font-semibold">Masa Transaksi</label>
                    <input type="time" id="masa" required class="w-full border p-2 rounded mt-1">
                </div>
            </div>

            <div>
                <label class="block font-semibold mb-1">Gambar Resit (Max 5MB)</label>
                <input type="file" id="gambarResit" accept="image/jpeg, image/png" required class="w-full border p-2 rounded bg-gray-50">
            </div>

            <!-- Ruang Pratonton -->
            <div id="previewContainer" class="hidden mt-4 border p-2 rounded bg-gray-100 text-center">
                <p class="text-xs text-gray-500 mb-2">Pratonton Imej (Sila pastikan tulisan jelas)</p>
                <img id="imagePreview" class="max-h-64 mx-auto rounded">
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-3 rounded mt-6 hover:bg-blue-700 transition">
                Sahkan & Hantar
            </button>
            <p id="statusMsg" class="text-center mt-2 font-bold hidden"></p>
        </form>
    </div>

    <script type="module" src="upload.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Urusetia - Laka Selatan 5K Trail Nanas Run 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    
    <!-- Navigasi Utama & Butang Kaunter -->
    <nav class="bg-blue-900 text-white p-4 shadow-md">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
            <!-- Tajuk Panel -->
            <h1 class="text-2xl md:text-3xl font-black tracking-wide uppercase">Panel Admin 5K Trail Nanas Run '26</h1>
            
            <!-- Ruang Butang Kanan -->
            <div class="flex items-center space-x-3">
                <span class="text-sm bg-blue-700 px-3 py-2 rounded font-semibold border border-blue-500 shadow-inner">
                    Mod Pengesahan Resit
                </span>
                
                <!-- Butang Buka Kaunter Serahan -->
                <a href="admin-kaunter.html" target="_blank" class="bg-purple-500 hover:bg-purple-600 text-white text-sm font-bold py-2 px-4 rounded shadow-lg transition flex items-center border border-purple-400">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    Buka Kaunter Serahan
                </a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-8 p-4 max-w-5xl">
        
        <div class="bg-white rounded-lg shadow-xl p-6 border-t-4 border-blue-600">
            <div class="flex justify-between items-center border-b pb-4 mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Senarai Menunggu Pengesahan</h2>
                <button onclick="location.reload()" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 py-1 px-3 rounded flex items-center transition">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Segar Semula (Refresh)
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-200 rounded-lg">
                    <thead class="bg-gray-100 text-gray-700 uppercase text-sm leading-normal">
                        <tr>
                            <th class="py-4 px-6 text-left border-b font-bold">ID / Peserta</th>
                            <th class="py-4 px-6 text-left border-b font-bold">Butiran Transaksi</th>
                            <th class="py-4 px-6 text-center border-b font-bold">Tindakan Kelulusan</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm font-medium text-gray-800">
                        <tr>
                            <td colspan="3" class="py-10 text-center text-gray-500 text-lg">
                                <div class="flex justify-center items-center">
                                    <svg class="animate-spin -ml-1 mr-3 h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    Memuatkan data pangkalan data...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="mt-8 text-center">
            <a href="index.html" class="inline-flex items-center text-blue-600 hover:text-blue-800 font-semibold hover:underline transition">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Kembali ke Laman Awam
            </a>
        </div>
    </div>

    <!-- Firebase dan Logik Admin -->
    <script type="module" src="admin.js"></script>
</body>
</html>

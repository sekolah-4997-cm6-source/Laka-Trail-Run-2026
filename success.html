<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempahan Berjaya - Laka Selatan 5K Nanas Trail Run</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Import Fon Bertema Sukan -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,800;1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-sports { font-family: 'Montserrat', sans-serif; }
        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-pattern text-gray-800 flex items-center justify-center min-h-screen p-4">
    
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-2xl border-t-8 border-t-green-500 text-center relative overflow-hidden">
        
        <!-- Hiasan Background Card -->
        <div class="absolute -right-10 -top-10 w-32 h-32 bg-green-50 rounded-full opacity-50"></div>
        <div class="absolute -left-10 bottom-10 w-24 h-24 bg-yellow-50 rounded-full opacity-50"></div>

        <div class="relative z-10">
            <div class="text-green-500 mb-4 bg-green-50 w-20 h-20 mx-auto rounded-full flex items-center justify-center shadow-inner">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            
            <h1 class="text-3xl font-sports font-black italic text-green-600 mb-2 uppercase tracking-wide">Tempahan Berjaya!</h1>
            <p class="text-sm font-medium text-gray-500 mb-6">Sila simpan ID Tempahan di bawah untuk rujukan dan semakan anda.</p>
            
            <!-- Kotak Paparan ID seakan 'Bib' Larian -->
            <div class="bg-gray-50 p-6 rounded-xl my-6 border-2 border-dashed border-gray-300 shadow-sm relative">
                <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-1">ID Pendaftaran Rasmi</p>
                <h2 id="displayId" class="text-4xl font-sports font-black text-gray-900 tracking-widest">MEMUATKAN...</h2>
            </div>
            
            <p class="text-xs font-semibold text-gray-500 mb-8 px-4">
                Anda boleh terus memuat naik bukti pembayaran sekarang atau melakukannya kemudian melalui menu <b>Semak Status</b>.
            </p>
            
            <!-- Butang Tindakan -->
            <div class="space-y-3">
                <a href="#" id="btnUpload" class="block w-full bg-yellow-400 text-yellow-900 font-sports font-black italic text-lg py-4 rounded-lg shadow-[0_4px_0_rgb(161,98,7)] hover:translate-y-1 hover:shadow-none hover:bg-yellow-300 transition-all duration-200">
                    MUAT NAIK RESIT SEKARANG
                </a>
                
                <a href="index.html" class="block w-full bg-gray-100 text-gray-600 font-bold py-3 px-4 rounded-lg hover:bg-gray-200 border border-gray-200 transition">
                    Kembali ke Laman Utama
                </a>
            </div>
        </div>
    </div>

    <!-- Skrip untuk menangkap ID dan memasukkannya ke dalam butang (DIKEKALKAN SEPENUHNYA) -->
    <script>
        // Dapatkan parameter 'id' dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const idTempahan = urlParams.get('id');

        if (idTempahan) {
            // Paparkan ID di skrin
            document.getElementById('displayId').innerText = idTempahan;
            
            // Kemas kini pautan butang supaya membawa ID bersama
            document.getElementById('btnUpload').href = `upload.html?id=${idTempahan}`;
        } else {
            // Halang akses jika tiada ID
            alert("Ralat: ID Tempahan tidak dijumpai.");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semakan Status - Laka Selatan Nanas Run 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col items-center min-h-screen pt-12">
    
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Semakan Pendaftaran</h2>
        
        <form id="semakForm" class="space-y-4">
            <div>
                <label class="block font-semibold mb-1 text-gray-700">No. Kad Pengenalan</label>
                <input type="text" id="icSemak" required placeholder="Cth: 901201025544" class="w-full border p-3 rounded bg-gray-50 focus:ring-2 focus:ring-green-500 focus:outline-none">
            </div>
            <button type="submit" id="btnSemak" class="w-full bg-green-600 text-white font-bold py-3 rounded hover:bg-green-700 transition shadow-md">
                Semak Status
            </button>
        </form>

        <!-- Keputusan Carian -->
        <div id="ruangKeputusan" class="hidden mt-8 border-t pt-6">
            <h3 class="font-bold text-lg text-gray-800 mb-4">Keputusan Semakan:</h3>
            
            <div class="space-y-3 text-sm">
                <p><strong>Nama:</strong> <span id="resNama" class="text-gray-600">-</span></p>
                <p><strong>ID Tempahan:</strong> <span id="resID" class="text-gray-600">-</span></p>
                <p><strong>Pakej:</strong> <span id="resPakej" class="text-gray-600">-</span></p>
                
                <div class="mt-4 p-4 rounded text-center border font-bold" id="resStatusBox">
                    <span id="resStatusText">STATUS SINI</span>
                </div>
            </div>

            <!-- Butang Tindakan Khas (Muncul ikut status) -->
            <button id="btnTindakan" class="hidden w-full text-white font-bold py-2 rounded mt-4 transition"></button>
        </div>
        
        <div class="text-center mt-6">
            <a href="index.html" class="text-sm text-green-600 hover:underline">← Kembali ke Laman Utama</a>
        </div>
    </div>

    <script type="module" src="semak.js"></script>
</body>
</html>
